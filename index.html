<audio id="bgm2" autoplay loop preload="auto">

</audio>
<!-- Seperate Music Javascript for Main Lobby -->
<script>
  const audio = document.getElementById('bgm2');
  const maxVolume = 0.5;
  let fadeInterval;

  window.addEventListener('load', () => {
    const savedTime = localStorage.getItem('musicTime');
    if (savedTime) audio.currentTime = parseFloat(savedTime);
  });

  setInterval(() => {
    if (!audio.paused) localStorage.setItem('musicTime', audio.currentTime);
  }, 500);

  function transitionVolume(target) {
    clearInterval(fadeInterval);
    if (target > 0 && audio.paused) {
      audio.play().catch(() => console.log("Click to enable audio"));
    }
    fadeInterval = setInterval(() => {
      if (audio.volume < target) {
        audio.volume = Math.min(audio.volume + 0.05, target);
      } else if (audio.volume > target) {
        audio.volume = Math.max(audio.volume - 0.05, target);
      }
      if (audio.volume === target) {
        clearInterval(fadeInterval);
        if (target === 0) audio.pause();
      }
    }, 100);
  }

  document.addEventListener("visibilitychange", () => {
    document.hidden ? transitionVolume(0) : transitionVolume(maxVolume);
  });

  document.addEventListener('click', () => {
    if (audio.paused) transitionVolume(maxVolume);
  }, { once: true });
</script>

document.querySelector('.start-btn-wrap').addEventListener('click', function(e) {
  e.preventDefault();   // Stops anchor/form default navigation triggers
  e.stopPropagation();  // Stops bubble actions to keep the login window open

  const provider = new firebase.auth.GoogleAuthProvider();
  
  auth.signInWithPopup(provider)
    .then((result) => {
      // Securely store credentials first
      localStorage.setItem('playerName', result.user.displayName);
      localStorage.setItem('playerEmail', result.user.email);
      // Clean hand-off to game loop only after successful database authentication
      window.location.href = 'maingame.html';
    })
    .catch((error) => {
      console.error('Login failed:', error); // Catches the error
      alert('Login failed: ' + error.message + ' (Code: ' + error.code + ')'); // Alerts the user regarding the error through the error message and code (for the developer)
    });
});
